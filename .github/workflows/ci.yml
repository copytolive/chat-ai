name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax, unit and 1000-case launch acceptance
        run: npm run check
      - name: Critical dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Start production-like local stack
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 3847
          RELEASE_VERSION: ci
          AUTOMATION_ENABLED: 'true'
          REQUIRE_HANDOFF_FOR_READY: 'true'
          WA_PROVIDER: cloud
          WA_CLOUD_ACCESS_TOKEN: test-token
          WA_CLOUD_PHONE_NUMBER_ID: '123456789'
          WA_CLOUD_VERIFY_TOKEN: verify-ci
          WA_CLOUD_APP_SECRET: secret-ci
          WA_QUEUE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          WA_QUEUE_DIR: /tmp/chat-ai-ci-webhook-queue
          HANDOFF_MODE: webhook
          HANDOFF_WEBHOOK_URL: http://127.0.0.1:9999/handoff
          HANDOFF_WEBHOOK_SECRET: handoff-ci-secret
          HANDOFF_QUEUE_DIR: /tmp/chat-ai-ci-handoff-queue
          AI_ENABLED: 'true'
          AI_BASE_URL: http://127.0.0.1:9999/v1
          AI_MODEL: mock-primary
          MARKETING_ENABLED: 'true'
          MARKETING_REQUIRE_KNOWLEDGE: 'true'
          MARKETING_COMPANY_NAME: CopyToLive
          MARKETING_BUSINESS: Verified CI business context
          KNOWLEDGE_FACTS: Verified CI fact
          STATE_FILE: /tmp/chat-ai-ci-state.json
        run: |
          rm -rf /tmp/chat-ai-ci-webhook-queue /tmp/chat-ai-ci-handoff-queue /tmp/chat-ai-ci-state.json
          node scripts/mock-ai.mjs > /tmp/mock-ai.log 2>&1 &
          echo $! > /tmp/mock-ai.pid
          node src/index.js > /tmp/chat-ai.log 2>&1 &
          echo $! > /tmp/chat-ai.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:3847/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:3847/ready | grep '"handoff":true'
          curl -fsS 'http://127.0.0.1:3847/webhooks/whatsapp?hub.mode=subscribe&hub.verify_token=verify-ci&hub.challenge=CI_OK' | grep CI_OK
          curl -fsS -H 'content-type: application/json' -d '{"sessionId":"ci","text":"Saya tertarik untuk tim saya"}' http://127.0.0.1:3847/marketing/preview | grep 'Mock validated reply'
          LAUNCH_BASE_URL=http://127.0.0.1:3847 node scripts/launch-doctor.mjs
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            /tmp/chat-ai.log
            /tmp/mock-ai.log

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Start Cloud and QR-scan browser fixtures
        run: |
          node scripts/browser-harness.mjs > /tmp/browser-harness.log 2>&1 &
          echo $! > /tmp/browser-harness.pid
          node scripts/browser-scan-harness.mjs > /tmp/browser-scan-harness.log 2>&1 &
          echo $! > /tmp/browser-scan-harness.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/status && break || sleep 1; done
          for i in {1..20}; do curl -fsS http://127.0.0.1:8766/status && break || sleep 1; done
      - name: Chromium Cloud browser acceptance
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=1440,1600 --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/ > browser-dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1600 --virtual-time-budget=5000 --screenshot=browser-launch.png http://127.0.0.1:8765/
          grep -q 'LAUNCH READY' browser-dom.html
          grep -q 'Browser acceptance reply' browser-dom.html
          grep -q 'DISCOVERY · 42/100' browser-dom.html
          grep -q 'ENCRYPTED · 0 PENDING' browser-dom.html
          grep -q 'READY · LOCAL INBOX · ENCRYPTED' browser-dom.html
          grep -q 'DURABLE JSON SINGLE INSTANCE HASHED CONTACT ID' browser-dom.html
      - name: Chromium QR scan before-pair acceptance
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=1440,1600 --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8766/ > browser-scan-qr-dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1600 --virtual-time-budget=4000 --screenshot=browser-scan-qr.png http://127.0.0.1:8766/
          grep -q 'WhatsApp pairing QR code' browser-scan-qr-dom.html
          grep -q 'NOT READY' browser-scan-qr-dom.html
          grep -q 'AUTO-RUN ENABLED' browser-scan-qr-dom.html
          grep -q 'SESSION PERSISTENT' browser-scan-qr-dom.html
      - name: Chromium QR scan connected auto-run acceptance
        run: |
          curl -fsS -X POST http://127.0.0.1:8766/simulate-scan | grep '"connected":true'
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=1440,1600 --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8766/ > browser-scan-connected-dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1600 --virtual-time-budget=4000 --screenshot=browser-scan-connected.png http://127.0.0.1:8766/
          grep -q 'LAUNCH READY' browser-scan-connected-dom.html
          grep -q 'CONNECTED' browser-scan-connected-dom.html
          grep -q 'AUTO-RUN ENABLED' browser-scan-connected-dom.html
          grep -q 'Connected · Auto-run' browser-scan-connected-dom.html
          grep -q 'WA /data/wa-auth' browser-scan-connected-dom.html
      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            browser-dom.html
            browser-launch.png
            browser-scan-qr-dom.html
            browser-scan-qr.png
            browser-scan-connected-dom.html
            browser-scan-connected.png
            /tmp/browser-harness.log
            /tmp/browser-scan-harness.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull -t copytolive/chat-ai:${{ github.sha }} .
